name: test

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Guzzle 5.x, 6.x and <7.15.2 have no release free of security
        # advisories, and setup-php installs Composer 2.9+ on PHP 7.2+, which
        # refuses to install them. PHP 7.2+ is therefore tested against
        # Guzzle 7 only; Guzzle 5 & 6 remain covered on PHP 5.5-7.1
        php-version: ['5.5', '5.6', '7.0', '7.1']
        guzzle-version: ['^5.3', '^6.0']
        include:
        - php-version: '7.2'
          guzzle-version: '^7.0'
        - php-version: '7.3'
          guzzle-version: '^7.0'
        - php-version: '7.4'
          guzzle-version: '^7.0'
        - php-version: '8.0'
          guzzle-version: '^7.0'
        - php-version: '8.1'
          guzzle-version: '^7.0'
        - php-version: '8.2'
          guzzle-version: '^7.0'
        - php-version: '8.3'
          guzzle-version: '^7.0'
        - php-version: '8.4'
          guzzle-version: '^7.9'
        - php-version: '8.5'
          guzzle-version: '^7.10'
        - php-version: '7.4'
          guzzle-version: '^8.0'
        - php-version: '8.0'
          guzzle-version: '^8.0'
        - php-version: '8.1'
          guzzle-version: '^8.0'
        - php-version: '8.2'
          guzzle-version: '^8.0'
        - php-version: '8.3'
          guzzle-version: '^8.0'
        - php-version: '8.4'
          guzzle-version: '^8.0'
        - php-version: '8.5'
          guzzle-version: '^8.0'

    steps:
    - uses: actions/checkout@v2

    - name: install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        extensions: intl, mbstring
        # by default setup-php uses a production php.ini so force development values
        ini-values: >-
          zend.exception_ignore_args=Off,
          zend.exception_string_param_max_len=15,
          error_reporting=-1,
          display_errors=On,
          display_startup_errors=On,
          zend.assertions=1

    - run: composer validate

    - name: require guzzle
      run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle-version }}" --no-update ${{ matrix.composer-flags }}

    - name: install dependencies
      run: composer update --prefer-dist --no-progress --no-suggest --no-interaction ${{ matrix.composer-flags }}

    - run: composer run-script test

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: we likely have to care about Guzzle's version too - ideally we'd
        #       check our use of Guzzle is correct on each version
        php-version: ['7.1', '8.2']
        phpstan-version: ['~1.4']

    steps:
    - uses: actions/checkout@v2

    - name: install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        extensions: intl, mbstring
        # by default setup-php uses a production php.ini so force development values
        ini-values: >-
          zend.exception_ignore_args=Off,
          zend.exception_string_param_max_len=15,
          error_reporting=-1,
          display_errors=On,
          display_startup_errors=On,
          zend.assertions=1

    # - name: require guzzle
    #   run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle-version }}" --no-update ${{ matrix.composer-flags }}

    - name: require phpstan
      run: composer require "phpstan/phpstan:${{ matrix.phpstan-version }}" --no-update ${{ matrix.composer-flags }}

    - name: install dependencies
      run: composer update --prefer-dist --no-progress --no-suggest --no-interaction ${{ matrix.composer-flags }}

    - run: ./vendor/bin/phpstan
